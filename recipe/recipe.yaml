schema_version: 1

context:
  version: "1.1.2"

package:
  name: jid
  version: ${{ version }}

source:
  url: https://github.com/simeji/jid/archive/v${{ version }}.tar.gz
  sha256: b86b8026e8aa216f31d31d8b9f6548be0533c4b20d555c65066db405075af081

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - jid --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Json incremental digger
  homepage: https://github.com/simeji/jid
  repository: https://github.com/simeji/jid

extra:
  recipe-maintainers:
    - danielnachun
