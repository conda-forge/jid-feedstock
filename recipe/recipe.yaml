schema_version: 1

context:
  version: "1.1.3"

package:
  name: jid
  version: ${{ version }}

source:
  url: https://github.com/simeji/jid/archive/v${{ version }}.tar.gz
  sha256: 5d1092316e13eb3029a76ffd749cf1ad8642511fe3762f00635feea32d24b7d1

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - jid --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Json incremental digger
  homepage: https://github.com/simeji/jid
  repository: https://github.com/simeji/jid

extra:
  recipe-maintainers:
    - danielnachun
